name: Release

on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: director-calendar-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      suite: ${{ steps.release.outputs.suite }}
      base_sha: ${{ steps.release.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Validate version, notes and existing tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py prepare

  tests:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      suite: ${{ needs.prepare.outputs.suite || 'full' }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}

  publish:
    needs: [prepare, tests]
    if: needs.prepare.outputs.publish == 'true' && needs.tests.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify the Windows distribution
        id: distribution
        uses: ./.github/actions/windows-distribution
      - name: Verify files and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TESTS_RESULT: ${{ needs.tests.result }}
          RELEASE_DISTRIBUTION_RESULT: ${{ steps.distribution.outcome }}
        run: python scripts/release.py publish --assets dist/artifacts
