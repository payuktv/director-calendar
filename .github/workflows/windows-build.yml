name: Windows distribution
on:
  pull_request:
    paths:
      - '.python-version'
      - 'packaging/**'
      - 'director_control/runtime_versions.py'
      - 'scripts/build_windows.ps1'
      - 'scripts/prepare_expat.py'
      - 'scripts/test_windows_distribution.py'
      - 'scripts/release.py'
      - 'director_control/distribution_check.py'
      - 'director_control/desktop.py'
      - 'director_control/windows_lifecycle.py'
      - 'director_control/sync_process.py'
      - 'director_control/update_check.py'
      - 'director_control/update_ui.py'
      - 'main.py'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/windows-distribution/**'
  workflow_dispatch:
  workflow_call:
concurrency:
  group: distribution-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify the Windows distribution
        uses: ./.github/actions/windows-distribution
