name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      suite:
        type: string
        default: full

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: ${{ fromJSON((inputs.suite == 'full' || github.event_name == 'workflow_dispatch') && '["windows-latest","ubuntu-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/build-tools.lock
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Bootstrap verified pip
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r packaging/build-tools.lock
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Use the shipped SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/prepare_sqlite.py "${{ runner.temp }}/director-sqlite"
          if ($LASTEXITCODE -ne 0) { throw 'SQLite preparation failed.' }
          "PYTHONPATH=${{ runner.temp }}/director-sqlite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Basic static checks
        run: python -m ruff check director_control tests scripts --select F
      - name: Run selected or full tests
        env:
          DIRECTOR_CONTROL_DATA_DIR: ${{ runner.temp }}/director-control-tests
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && 'full' || inputs.suite || 'focused' }}
        run: python scripts/run_ci_tests.py --platform ${{ runner.os }}
      - name: Verify zero skips and required platform coverage
        if: always()
        run: python scripts/verify_test_results.py pytest-results.xml --platform ${{ runner.os }}
      - name: Save test scope, timing and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}
          path: |
            pytest-results.xml
            ci-test-plan.json
          if-no-files-found: warn
          retention-days: 14
