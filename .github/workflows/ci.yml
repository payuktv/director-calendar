name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Basic static checks
        run: python -m ruff check director_control tests scripts --select F
      - name: Unit and GUI smoke tests
        env:
          DIRECTOR_CONTROL_DATA_DIR: ${{ runner.temp }}/director-control-tests
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Verify zero skips and required platform coverage
        if: always()
        run: python scripts/verify_test_results.py pytest-results.xml --platform ${{ runner.os }}
