[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director-control"
version = "0.1.0"
description = "Local Windows plan/fact calendar tracking prototype"
requires-python = ">=3.13,<3.15"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["director_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.pyside6.deploy]
title = "DirectorControl"
input_file = "main.py"
exec_directory = "dist"
mode = "standalone"
