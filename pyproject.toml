[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director-control"
version = "0.13.0"
description = "Local Windows plan/fact calendar tracking prototype"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6==6.12.0",
    "requests>=2.32,<3",
    "icalendar>=6.3,<8",
    "recurring-ical-events>=3.8,<4",
    "keyring>=25.6,<27",
    "defusedxml>=0.7.1,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["director_control*"]

[tool.setuptools.package-data]
director_control = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

